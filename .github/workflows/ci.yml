# Continuous integration for the plugin itself.
#
# Three jobs, in rough order of how they have actually broken:
#   install-path  — the clone-then-install sequence a new user runs. In v2.8.3 a
#                   670 MB blob in HEAD stalled this step with no error message
#                   and no test caught it.
#   test          — the bash suites (`make test`).
#   lint          — shellcheck + markdownlint.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-path:
    name: Install path (size gate + clean-clone smoke test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'

      - name: Repo size gate
        run: bash scripts/tools/check-repo-size.sh

      - name: Clean-clone install smoke test
        run: bash scripts/tools/install-smoke-test.sh

  test:
    name: Test suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Configure git identity
        run: |
          # Suites that build throwaway repos need a committer.
          git config --global user.email ci@example.com
          git config --global user.name CI

      - name: make test
        run: make test

      - name: Integrations are in sync with skills
        run: |
          make build
          if ! git diff --quiet -- integrations/; then
            echo "::error::integrations/ is stale — run 'make build' and commit the result"
            git diff --stat -- integrations/
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # Blocking: scripts/ and tests/ are shellcheck-clean as of this commit,
      # so any new warning is a regression introduced by the change under review.
      - name: Shellcheck (blocking)
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            shellcheck --severity=warning -e SC1091,SC1090,SC2034,SC2164,SC2143 "$f" || fail=1
          done < <(find scripts tests -name '*.sh' -print0)
          exit $fail

      # Advisory: ~4k pre-existing markdownlint violations across the skill
      # corpus. Gating on it would block every PR for reasons unrelated to the
      # PR. Reported, not enforced, until that backlog is cleared — then drop
      # continue-on-error. Version-pinned so a new rule release does not silently
      # change what "clean" means.
      - name: Markdownlint (advisory)
        continue-on-error: true
        run: |
          npm install -g markdownlint-cli@0.49.1
          markdownlint "**/*.md" \
            --ignore node_modules --ignore draft.tmp \
            --ignore "draft/tracks" --ignore integrations
