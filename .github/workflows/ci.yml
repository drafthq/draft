# Continuous integration for the plugin itself.
#
# Three jobs, in rough order of how they have actually broken:
#   install-path  — the clone-then-install sequence a new user runs. In v2.8.3 a
#                   670 MB blob in HEAD stalled this step with no error message
#                   and no test caught it.
#   test          — the bash suites (`make test`).
#   lint          — shellcheck + markdownlint.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-path:
    name: Install path (size gate + clean-clone smoke test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'

      - name: Repo size gate
        run: bash scripts/tools/check-repo-size.sh

      - name: Clean-clone install smoke test
        run: bash scripts/tools/install-smoke-test.sh

  test:
    name: Test suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'

      # jq ships in the GitHub-hosted runner image (1.7.1 on ubuntu-24.04, 1.6 on
      # 22.04), so installing it was a redundant apt call on the same mirror that
      # stalled the Lint job twice. Assert it instead: if a future image drops it,
      # this fails here with an obvious message rather than as a confusing
      # graph-tool test failure further down.
      - name: Verify jq is available
        run: jq --version

      - name: Configure git identity
        run: |
          # Suites that build throwaway repos need a committer.
          git config --global user.email ci@example.com
          git config --global user.name CI

      - name: make test
        run: make test

      - name: Integrations are in sync with skills
        run: |
          make build
          if ! git diff --quiet -- integrations/; then
            echo "::error::integrations/ is stale — run 'make build' and commit the result"
            git diff --stat -- integrations/
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Pinned static binary rather than `apt-get install shellcheck`: the apt
      # step stalled on the runner's package mirror twice in three pushes — once
      # for 12 minutes, once until the job was cancelled, taking both blocking
      # lint checks down as "skipped". Checksum-verified, so a moved or swapped
      # release asset fails the job instead of silently running unknown code.
      - name: Install shellcheck
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          curl -fsSL --retry 3 --retry-all-errors --max-time 180 -o shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz
          sudo install -m 0755 "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      # Blocking: scripts/ and tests/ are shellcheck-clean as of this commit,
      # so any new warning is a regression introduced by the change under review.
      - name: Shellcheck (blocking)
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            shellcheck --severity=warning -e SC1091,SC1090,SC2034,SC2164,SC2143 "$f" || fail=1
          done < <(find scripts tests -name '*.sh' -print0)
          exit $fail

      # Blocking as of this commit: the backlog that kept it advisory is cleared
      # (1691 violations -> 0), so anything it reports now was introduced by the
      # change under review — the same standard shellcheck is held to.
      # Version-pinned so a new rule release does not silently change what
      # "clean" means.
      - name: Markdownlint (blocking)
        run: |
          npm install -g markdownlint-cli@0.49.1
          markdownlint "**/*.md" --ignore-path .gitignore \
            --ignore node_modules --ignore draft.tmp \
            --ignore "draft/tracks" --ignore integrations
