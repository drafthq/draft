<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found — Draft</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#06080e">
    <meta name="color-scheme" content="dark light">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style"
        href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
        onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
        <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    </noscript>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <script>
    (function(){try{if(localStorage.getItem('draft-theme')==='light')document.documentElement.removeAttribute('data-theme');}catch(e){}})();
    </script>
    <style>
        .nf-wrap {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6rem var(--gutter) 4rem;
            position: relative;
            z-index: 1;
        }
        .nf-card {
            width: 100%;
            max-width: 560px;
            padding: 2.5rem 2.25rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            text-align: center;
        }
        .nf-status {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--accent-amber);
            border: 1px solid rgba(var(--accent-2-rgb), 0.5);
            background: var(--glow-amber);
            border-radius: 6px;
            padding: 0.25rem 0.6rem;
            display: inline-block;
            margin-bottom: 1.25rem;
        }
        .nf-code {
            font-family: var(--font-display);
            font-size: clamp(4rem, 12vw, 6.5rem);
            font-weight: 800;
            letter-spacing: -0.05em;
            line-height: 0.95;
            color: var(--accent-cyan);
            margin-bottom: 0.75rem;
        }
        .nf-title { font-size: 1.35rem; margin-bottom: 0.5rem; }
        .nf-text { color: var(--text-secondary); max-width: 40ch; margin: 0 auto 1.75rem; }
        .nf-query {
            display: block;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--pane-muted);
            background: var(--bg-pane);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.75rem 1rem;
            margin: 0 0 1.75rem;
            text-align: left;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .nf-query b { color: var(--pane-text); font-weight: 500; }
        .nf-query .ok { color: var(--accent-rose); }
        .nf-links { display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: center; }
    </style>
</head>
<body>
    <nav class="top-nav" id="top-nav" aria-label="Primary">
        <a href="/" class="nav-logo" aria-label="Draft home">
            <svg class="logo-mark" viewBox="0 0 26 26" fill="none" aria-hidden="true">
                <path class="lm-edge" d="M6 19L13 7L20 19M6 19H20" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                <circle class="lm-node" cx="6" cy="19" r="2.6"/>
                <circle class="lm-node" cx="20" cy="19" r="2.6"/>
                <circle class="lm-hot" cx="13" cy="7" r="3"/>
            </svg>
            Draft
        </a>
        <div class="nav-links" id="nav-links">
            <a href="/#playground">Engine</a>
            <a href="/#commands">Workflow</a>
            <a href="/#features">Capabilities</a>
            <a href="/#install">Install</a>
            <a href="/book/">Book</a>
            <a href="/blog/">Blog</a>
        </div>
        <div class="nav-actions" id="nav-actions">
            <a href="/changelog/" class="nav-version" title="Release notes">v5.0.1</a>
            <a href="https://github.com/drafthq/draft" target="_blank" rel="noopener noreferrer" class="nav-github">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
                Star on GitHub
                <span class="gh-stars" id="gh-stars"></span>
            </a>
        </div>
        <button type="button" class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="nav-links nav-actions">
            <span></span><span></span><span></span>
        </button>
    </nav>

    <main class="nf-wrap">
        <div class="nf-card">
            <span class="nf-status">HTTP 404</span>
            <div class="nf-code">404</div>
            <h1 class="nf-title">Page not found</h1>
            <p class="nf-text">That page doesn't exist or has moved. The graph has no node for it.</p>
            <code class="nf-query" id="nf-query">$ graph-callers --symbol <b id="nf-path">this-page</b> <span class="ok">→ 0 results</span></code>
            <div class="nf-links">
                <a href="/" class="btn btn-primary">Home</a>
                <a href="/book/" class="btn btn-secondary">The Book</a>
                <a href="/blog/" class="btn btn-secondary">Blog</a>
                <a href="https://github.com/drafthq/draft" target="_blank" rel="noopener noreferrer" class="btn btn-tertiary">GitHub</a>
            </div>
        </div>
    </main>

    <script>
    (function(){var b=document.getElementById('nf-path');if(b){b.textContent=location.pathname.replace(/^\/+|\/+$/g,'')||'/';}})();
    </script>
    <script src="/js/main.js"></script>
    <script src="/js/theme-toggle.js"></script>
</body>
</html>
